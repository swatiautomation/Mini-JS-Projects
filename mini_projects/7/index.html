<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="mainContainer">
      <h1>Rock Paper Scissors</h1>
      <div class="container">
        <button class="rock-div move-btn" aria-label="Rock">
          <img src="./images/rock-emoji.png" alt="" class="move-icon" />
        </button>

        <button class="paper-div move-btn" aria-label="Paper">
          <img src="./images/paper-emoji.png" alt="" class="move-icon" />
        </button>

        <button class="scissors-div move-btn" aria-label="Scissors">
          <img src="./images/scissors-emoji.png" alt="" class="move-icon" />
        </button>
      </div>
      <div class="scoreContainer" aria-live="polite" aria-atomic="true">
        <div class="computer-move"></div>
        <div class="result-message result"></div>
        <div class="score"></div>
      </div>

      <div class="btn">
        <button class="reset-button">Reset Score</button>
        <button class="auto-play-button" aria-pressed="false">Auto Play</button>
      </div>

      <dialog
        class="confirmation-dialog"
        role="alertdialog"
        aria-labelledby="confirm-text"
      >
        <p id="confirm-text">Are you sure you want to reset the score?</p>
        <button class="yes-button">Yes</button>
        <button class="no-button" autofocus>No</button>
      </dialog>
    </main>

    <script src="script.js"></script>
  </body>
</html>
