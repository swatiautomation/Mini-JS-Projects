<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Search App</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header>
      <h1 id="header-title"><a href="./">Image Search App</a></h1>
      <form action="">
        <div class="search-container">
          <label for="word-input" class="sr-only">Search Image</label>
          <input
            type="search"
            id="word-input"
            placeholder="Search images"
            class="searchInput"
          />
          <button type="submit" aria-label="Search">
            <i class="fa fa-search" aria-hidden="true" id="search-btn"></i>
          </button>
        </div>
      </form>
    </header>

    <main>
      <p id="status" class="sr-only" role="status" aria-live="polite"></p>
      <section>
        <div class="image-container">
          <h2>Search for Images only</h2>
        </div>
        <button class="loadMoreBtn">Load More</button>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
